name: Feature request
description: Suggest a new slide template, tracker, language or other improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to report or do
      description: Describe the situation and who reads your report, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Showship to do
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New slide template or design
        - New task tracker collector
        - Language or plain-language rules
        - Installer or configuration
        - Another agent or platform
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md)
